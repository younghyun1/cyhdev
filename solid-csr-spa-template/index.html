<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <title>Younghyun's Blog</title>
    <script>
      // Resolve theme before first paint to avoid a light-mode flash for
      // dark-mode users. Resolution order must mirror src/state/theme.ts:
      // localStorage -> prefers-color-scheme -> light.
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("theme");
        } catch (e) {
          /* storage unavailable (private mode); fall through */
        }
        if (t !== "light" && t !== "dark") {
          t =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
        }
        document.documentElement.classList.add(t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#000000" : "#f6f1e8");
      })();
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/index.tsx" type="module"></script>
  </body>
</html>
