[package]
name = "minecraft-seed"
version.workspace = true
edition.workspace = true
license = "GPL-3.0-only"
publish = false

[dependencies]
mimalloc.workspace = true
# Both packages must use the same reviewed 26.3 generation/data revision.
pumpkin-world = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "5152bb5c1db05f63003fc7e1cd26ba293a45de41", default-features = false }
pumpkin-data = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "5152bb5c1db05f63003fc7e1cd26ba293a45de41", default-features = false, features = ["noise_router", "chunk"] }
pumpkin-util = { git = "https://github.com/Pumpkin-MC/Pumpkin", rev = "5152bb5c1db05f63003fc7e1cd26ba293a45de41", default-features = false }
serde = { version = "1.0.229", default-features = false, features = ["derive", "std"] }
serde_json.workspace = true
thiserror = "2.0.21"
rayon = "1.12.0"
tokio = { workspace = true, features = ["sync"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "time"] }

[lints]
workspace = true
