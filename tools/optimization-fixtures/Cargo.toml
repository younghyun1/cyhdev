[package]
name = "optimization-fixtures"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

[dependencies]
rust-be-template = { path = "../../rust-be-template" }
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["full"] }
tracing.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
diesel = { version = "2.3.13", features = ["postgres", "chrono", "serde_json", "uuid"] }
diesel-async = { version = "0.9.2", features = ["bb8", "postgres"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }
zeroize = "1.9.0"
axum = { version = "0.8.9", features = ["ws"] }
rustls = "0.23.45"
tokio-rustls = "0.26.6"
openidconnect = { version = "4.0.1", default-features = false }
base64 = "0.23.1"
sha2 = "0.11.0"
futures-util = { version = "0.3.34", features = ["sink"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
reqwest = { version = "0.13.5", features = ["json"] }
