# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  server:
    build:
      context: ..
      dockerfile: rust-be-template/Dockerfile
      target: final
      pull: true
    # Runtime configuration stays outside the image and build context.
    env_file:
      - .env
    # Loopback only: this file is for local runs, so other hosts on the network
    # cannot reach the container. Deployments publish ports explicitly.
    ports:
      - 127.0.0.1:30737:443
      # WebRTC SFU media. The default 64-port range covers the maximum room
      # capacity; keep its start in sync with RTC_UDP_PORT_START.
      - 127.0.0.1:3478-3541:3478-3541/udp
    # The image runs as UID 65532 and only the paths below are writable.
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      # Upload and photo batch staging. tmpfs holds only what is staged, and
      # the size bounds one full batch (50 files of up to 150 MiB) plus headroom.
      - /tmp:mode=1777,size=8g
    volumes:
      # Relative CERT_CHAIN_DIR and PRIV_KEY_DIR values such as ./certs/... resolve
      # against the image working directory, /bin. UID 65532 must be able to
      # traverse this directory and read both files.
      - ./certs:/bin/certs:ro
      # New named volumes inherit the image directories' UID 65532 ownership.
      # A non-default SEARCH_INDEX_PATH must point inside a writable mount.
      - search-index:/bin/data/search_index
      - logs:/bin/logs

# The commented out section below is an example of how to define a PostgreSQL
# database that your application can use. `depends_on` tells Docker Compose to
# start the database before your application. The `db-data` volume persists the
# database data between container restarts. The `db-password` secret is used
# to set the database password. You must create `db/password.txt` and add
# a password of your choosing to it before running `docker compose up`.
#     depends_on:
#       db:
#         condition: service_healthy
#   db:
#     image: postgres
#     restart: always
#     user: postgres
#     secrets:
#       - db-password
#     volumes:
#       - db-data:/var/lib/postgresql/data
#     environment:
#       - POSTGRES_DB=example
#       - POSTGRES_PASSWORD_FILE=/run/secrets/db-password
#     expose:
#       - 5432
#     healthcheck:
#       test: [ "CMD", "pg_isready" ]
#       interval: 10s
#       timeout: 5s
#       retries: 5

volumes:
  search-index:
  logs:
