[workspace]
members = [
    "rust-be-template",
    "tools/throughput",
    "tools/xtask",
    "wasm_demos/block_breaker",
    "wasm_demos/ray_tracer",
]
exclude = ["vendor/eu5-location-filter"]
default-members = [
    "rust-be-template",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
dotenvy = "0.15.7"
mimalloc = { version = "0.1.52", default-features = false }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokio = { version = "1.53.1", default-features = false }
tracing = { version = "0.1.44", features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
incremental = false
strip = true
lto = true
panic = "unwind"

[profile.release-abort]
inherits = "release"
panic = "abort"

[profile.wasm-release]
inherits = "release-abort"
opt-level = "z"
