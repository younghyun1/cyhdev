[workspace]
members = [
    "kcna-archive/cli",
    "kcna-archive/core",
    "rust-be-template",
    "tools/throughput",
    "tools/minecraft-seed",
    "tools/optimization-fixtures",
    "tools/xtask",
    "wasm_demos/block_breaker",
    "wasm_demos/ray_tracer",
]
exclude = ["vendor/eu5-location-filter"]
default-members = [
    "rust-be-template",
    "tools/xtask",
]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.104"
jiff = { version = "1.0.2", features = ["serde"] }
# Diesel wrapper types for jiff values; the PostgreSQL feature only enables
# diesel/postgres_backend, so it links no libpq of its own.
jiff-diesel = { version = "1.0.0", features = ["postgres"] }
dotenvy = "0.15.7"
mimalloc = { version = "0.1.52", default-features = false }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
tokio = { version = "1.54.1", default-features = false }
tracing = { version = "0.1.44", features = ["std"] }
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "json"] }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
perf = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Dependencies carry no debug info in development and test builds. Their DWARF
# was about 900 MB of each roughly 1 GB backend test binary and was rewritten on
# every link. Workspace crates keep full debug info; dependency frames in a
# backtrace still show function names, without file and line.
[profile.dev.package."*"]
debug = false

# The archive collector and its tests run the importer and the snapshot writer
# against the full corpus in development builds, and the backend answers
# archive searches there too. Unoptimized, Tantivy alone takes about nine times
# as long to index the corpus, so the search, compression, hashing, and HTML
# parsing crates are optimized once and cached; everything else stays quick to
# build.
[profile.dev.package.tantivy]
opt-level = 3
[profile.dev.package.tantivy-columnar]
opt-level = 3
[profile.dev.package.tantivy-bitpacker]
opt-level = 3
[profile.dev.package.tantivy-common]
opt-level = 3
[profile.dev.package.tantivy-fst]
opt-level = 3
[profile.dev.package.tantivy-sstable]
opt-level = 3
[profile.dev.package.tantivy-stacker]
opt-level = 3
[profile.dev.package.tantivy-tokenizer-api]
opt-level = 3
[profile.dev.package.zstd-sys]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.lz4_flex]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.html5ever]
opt-level = 3
[profile.dev.package.scraper]
opt-level = 3
[profile.dev.package.selectors]
opt-level = 3
[profile.dev.package.encoding_rs]
opt-level = 3
[profile.dev.package.regex-automata]
opt-level = 3
[profile.dev.package.serde_json]
opt-level = 3
[profile.dev.package.kcna-archive-core]
opt-level = 2

[profile.release]
opt-level = 3
codegen-units = 1
debug = false
incremental = false
strip = true
lto = true
panic = "unwind"

[profile.release-abort]
inherits = "release"
panic = "abort"

[profile.wasm-release]
inherits = "release-abort"
opt-level = "z"
