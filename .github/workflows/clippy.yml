name: Clippy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang lld libpq-dev libzstd-dev pkg-config
      - name: Install configured Rust toolchain
        run: rustup show active-toolchain
      - name: Run implementation gate
        run: cargo xtask clippy
