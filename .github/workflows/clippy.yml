name: Clippy

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: clippy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          # Later steps build untrusted pull request code; do not leave the
          # job token in .git/config for it to read.
          persist-credentials: false
      - name: Install native dependencies
        run: sudo apt-get update && sudo apt-get install --yes clang lld libpq-dev libzstd-dev pkg-config
      - name: Install configured Rust toolchain
        run: rustup show active-toolchain
      - name: Run implementation gate
        run: cargo xtask clippy
